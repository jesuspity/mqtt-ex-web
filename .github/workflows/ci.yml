name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py tests/smoke.py
      - run: python tests/smoke.py
        env:
          MQTT_DATA_DIR: /tmp/mqtt-web-ci-data
          WEB_USER: ci-user
          WEB_PASS: ci-only-test-password
